# Marathon Training — Apache reverse proxy
#
# Canonical source of truth (version-controlled). Installed by copying to:
#   /etc/apache2/other/marathon.conf
# which macOS Apache auto-loads via this line in /etc/apache2/httpd.conf:
#   Include /private/etc/apache2/other/*.conf
#
# Self-contained on purpose: it loads its own proxy modules, so it keeps
# working even if httpd.conf is reset to defaults by a macOS update. If that
# ever happens, just re-copy this file into /etc/apache2/other/ and restart
# Apache (see deploy/README in this folder, or the install commands below).
#
# Install / update:
#   sudo cp deploy/marathon.apache.conf /etc/apache2/other/marathon.conf
#   sudo apachectl configtest && sudo apachectl restart
#
# This proxies port 80 -> the app on 127.0.0.1:8000, so the app stays
# unprivileged and is reachable at http://<your-mac>.local (and the LAN IP)
# with no port in the URL.

LoadModule proxy_module libexec/apache2/mod_proxy.so
LoadModule proxy_http_module libexec/apache2/mod_proxy_http.so

<VirtualHost *:80>
    # The single default vhost: all port-80 traffic is proxied to the app,
    # regardless of which name (<your-mac>.local, the IP, etc.) was used.
    #
    # To host multiple apps by name later, give each its own <VirtualHost>
    # with a distinct ServerName and backend port — but note that custom
    # names must also resolve network-wide (router DNS), which Apache does
    # not provide on its own.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
